name: Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: 'read'

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Set up JDK
        uses: 'actions/setup-java@v5'
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: 'gradle/actions/setup-gradle@v5'
        with:
          gradle-version: '7.5.1'

      - name: Build with Gradle
        run: './gradlew build'
